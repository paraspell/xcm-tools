on:
  push:
    branches:
      - main

name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      sdk_core_released: ${{ steps.release.outputs['packages/sdk-core--release_created'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: ${{ github.ref_name }}

  publish_packages_and_deploy_websites:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare environment
        run: |
          echo DATABASE_URL="file:./dev.db" > apps/xcm-api/.env

      - name: Build project
        run: pnpm build

      - name: Compile project
        run: pnpm compile

      - name: Check lint
        run: pnpm lint:check

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Publish packages
        run: pnpm publish -r --no-git-checks --access=public

      - name: Publish Playground
        run: pnpm exec netlify deploy --prod --site $PLAYGROUND_SITE_ID --filter @paraspell/playground
        env:
          PLAYGROUND_SITE_ID: ${{ secrets.PLAYGROUND_SITE_ID }}

      - name: Publish ParaSpell Website
        run: pnpm exec netlify deploy --no-build --prod --site paraspell --filter @paraspell/site

  deploy_xcm_api:
    needs: release-please
    if: needs.release-please.outputs.sdk_core_released == 'true'
    runs-on: self-hosted
    steps:
      - name: Pull latest changes
        run: git pull

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build XCM API
        run: pnpm --filter xcm-api... build

      - name: Restart PM2 process
        run: pm2 reload xcm-api
        env:
          PM2_HOME: /${{ secrets.USER }}/.pm2
